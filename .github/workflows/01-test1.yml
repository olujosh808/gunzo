name: First run-name
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-testing:
    name: running unit testing
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v7
      - name: set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: run tests
        run: |
          pytest -v
