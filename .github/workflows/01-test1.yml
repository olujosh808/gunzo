name: First run-name
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-testing:
    name: running unit testing
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v4 # Safely downgraded to the current stable major version

      - name: set up Python
        uses: actions/setup-python@v5 # Stable version
        with:
          python-version: "3.11"
          cache: "pip" # Opportunity captured: This will cache your dependencies and speed up the run!

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run tests
        run: |
          mkdir -p test-reports/
          pytest --collect-only  # See what tests are discovered
          pytest --junitxml=test-reports/unit-test-results.xml --cov=. --cov-report=xml --cov-report=term-missing -v
          # Fixed the typo here: "term-missing" now has no space.

      - name: upload test results
        uses: actions/upload-artifact@v4 # Stable version
        if: always() # Blind spot covered: This ensures the report uploads even if tests fail
        with:
          name: unit-test-results
          path: test-reports/
  CodeQL:
    name: Codeql security scan
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      matrix:
        language: ["python"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Stable version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3 # Stable version
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3 # Stable version

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "security"
