name: First run-name
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NAME: "Olusegun"
  APP_USER: "Administrator"
  APP_PORT: "80"
jobs:
  simple-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: step 1
        run: |
          pwd
          ls -la
          hostname

      - name: step 3
        run: |
          echo 'pwd' >> singlefile.txt
          mkdir -p artifacts
          echo 'ls -la' >> artifacts/folderlist.txt
          echo 'hostname' >> artifacts/hostname.txt

      - name: upload single file
        uses: actions/upload-artifact@v4
        with:
          name: singlefile
          path: ./singlefile.txt

  second-job:
    needs: simple-job
    runs-on: ubuntu-latest
    steps:
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: singlefile
      - name: referencing enironment variables
        run: |
          echo "Environment name is $NAME"
          echo "Application user is $APP_USER"
          echo "Application port is $APP_PORT"

      - name: verify downloaded files
        run: |
          pwd
          ls -ltr
          cat singlefile.txt
      - name: kill code
        run: exit 0
