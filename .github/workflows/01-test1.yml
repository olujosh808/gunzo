name: First run-name
on:
  push:
    branches:
      - main
jobs:
  simple-job:
    runs-on: ubuntu-latest
    steps:
      - name: step 1
        run: |
          pwd
          ls -la
          hostname
      - name: checkout
        uses: actions/checkout@v5
      - name: step 3
        run: |
          echo pwd >> singlefile.txt
          ls -la
          hostname
      - name: upload single file
        uses: actions/upload-artifact@v3
        with:
          name: singlefile
          path: ./singlefile.txt
